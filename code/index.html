<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#17251e">
    <title>Gravity Garden</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-rounded, "Avenir Next", Avenir, sans-serif;
        background: #17251e;
        color: #f2f2d9;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(ellipse at 50% 0%, #31483a 0, transparent 56%),
          #17251e;
      }

      main {
        width: min(100%, 1000px);
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 20px;
        margin: 0 4px 14px;
      }

      h1 {
        margin: 0;
        color: #f1d88a;
        font-size: clamp(1.7rem, 5vw, 2.6rem);
        letter-spacing: 0.04em;
      }

      header p {
        margin: 0 0 3px;
        color: #b7c8a9;
        font-size: 0.95rem;
        text-align: right;
      }

      .frame {
        overflow: hidden;
        border: 2px solid #71815d;
        border-radius: 18px;
        background: #24372d;
        box-shadow: 0 24px 70px #080f0bc2;
      }

      canvas {
        display: block;
        width: 100%;
        aspect-ratio: 8 / 5;
        touch-action: none;
      }

      footer {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        margin: 12px 4px 0;
        color: #b7c8a9;
        font-size: 0.88rem;
      }

      #status {
        color: #f1d88a;
        text-align: right;
      }

      @media (max-width: 620px) {
        body {
          padding: 14px;
        }

        header,
        footer {
          align-items: start;
          flex-direction: column;
          gap: 5px;
        }

        header p,
        #status {
          text-align: left;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Gravity Garden</h1>
        <p>A tiny robot. A very unusual garden.</p>
      </header>
      <div class="frame">
        <canvas id="game" aria-label="Gravity Garden game"></canvas>
      </div>
      <footer>
        <span>Move: A / D or ← / → · Jump: Space / ↑ · Restart: R</span>
        <span id="status" aria-live="polite">Find the glowing seeds.</span>
      </footer>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
